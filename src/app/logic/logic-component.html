<div class="container mt-4">
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link" [class.active]="activeTab() === 'decoded'" type="button" role="tab"
                [attr.aria-selected]="activeTab() === 'decoded'" (click)="setActiveTab('decoded')">
                <span class="bi bi-cpu"></span> Decoded Logic
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" [class.active]="activeTab() === 'library'" type="button" role="tab"
                [attr.aria-selected]="activeTab() === 'library'" (click)="setActiveTab('library')">
                <span class="bi bi-braces"></span> Clinical Reasoning Library
            </button>
        </li>
    </ul>

    @if (activeTab() === 'decoded') {
        <div class="container-fluid mt-4 p-0">
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-floating">
                        <input id="libraryId" class="form-control" type="text" [formField]="editorForm.libraryId">
                        <label for="libraryId"> Library ID</label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-floating">
                        <input id="libraryVersion" class="form-control" type="text" [formField]="editorForm.version">
                        <label for="libraryVersion"> Version</label>
                    </div>
                </div>
            </div>
            <div class="form-floating mt-2">
                <input id="libraryDescription" class="form-control" type="text" [formField]="editorForm.description">
                <label for="libraryDescription"> Description</label>
            </div>
            <div class="form-floating mt-2">
                <textarea id="exampleCql" class="form-control" [formField]="editorForm.cql"
                    placeholder="Enter CQL here..." style="height: 500px"></textarea>
                <label for="exampleCql"> Example CQL</label>
            </div>

            <button class="btn btn-danger m-2 float-end" (click)="deleteCql()">
                <span class="bi bi-trash"></span> Delete from Server
            </button>
            <div class="btn-group m-2 float-end">
                <button class="btn btn-outline-primary" (click)="reloadLibraryFromServer()">
                    <span class="bi bi-arrow-clockwise"></span> Reload From Server
                </button>
                <button class="btn btn-outline-primary" (click)="reloadExampleCql()">
                    <span class="bi bi-arrow-clockwise"></span> Load CQL Example into Editor
                </button>
            </div>
            <button class="btn btn-primary m-2" (click)="saveCql()">
                <span class="bi bi-upload"></span> Save to Server
            </button>
        </div>
    }

    @if (activeTab() === 'library') {
        <div class="mt-4">
            <pre class="line-numbers"><code [highlight]="libraryAsString()" language="json"></code></pre>
        </div>
    }
</div>
